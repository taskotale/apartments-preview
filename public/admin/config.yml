# ⚠️  DEMO CONFIG — backend is "test-repo" (everything is stored only in this
#     browser, nothing is saved anywhere). The real site will use the GitHub
#     backend + the Cloudflare auth worker (Phase 4). The collections, the
#     Montenegrin labels and the fields below are the real ones.

backend:
  name: test-repo

locale: me
media_folder: "src/assets/photos"
public_folder: "/src/assets/photos"

# Sisters only ever see these collections. Everything is written in Montenegrin;
# the other 9 languages are filled in afterwards and never shown here.
collections:
  - name: tekstovi
    label: "Tekstovi na sajtu"
    label_singular: "tekst"
    description: "Pišite na crnogorskom — prevod na ostale jezike se dodaje naknadno."
    files:
      - name: apartman
        label: "Opis apartmana"
        file: "src/content/apartment/me.md"
        fields:
          - { name: title, label: "Naslov", widget: string, default: "More i planine, iz samog centra Bara" }
          - name: body
            label: "Tekst"
            widget: markdown
            hint: "Opišite apartman svojim riječima — krevet, kuhinju, balkon, pogled."
            default: |
              **Mare e Monti** — „more i planine“ — upravo je ono što se vidi s balkona:
              Jadran s jedne, brda iznad Bara s druge strane. Apartman je potpuno nov, u
              zgradi K Residence u samom centru grada — moderan i svijetao, sa retro detaljima.

              Čeka vas gramofon, flaša vina za dobrodošlicu i zalazak sunca zbog kojeg gosti
              ostaju na balkonu dugo nakon večere. Prodavnice, pijaca, kafići i restorani —
              sve je na par minuta hoda.
      - name: okolina
        label: "Okolina i plaže"
        file: "src/content/area/me.md"
        fields:
          - { name: title, label: "Naslov", widget: string, default: "Bar, na dohvat ruke" }
          - name: body
            label: "Tekst"
            widget: markdown
            default: |
              Gradska plaža Topolica je 13 minuta hoda, centar Bara pet. U blizini su Stari
              Bar pod Rumijom i Stara maslina — jedno od najstarijih stabala na svijetu.
      - name: pravila
        label: "Kućna pravila"
        file: "src/content/rules/me.md"
        fields:
          - name: body
            label: "Tekst"
            widget: markdown
            default: |
              Prijava od 15:00, odjava do 11:00. Parking je besplatan, pored zgrade.
              Kućni ljubimci nisu dozvoljeni. Zabranjeno je pušenje. Za cijene i termine —
              pišite nam, odgovaramo brzo.
      - name: onama
        label: "O nama"
        file: "src/content/about/me.md"
        fields:
          - name: body
            label: "Tekst"
            widget: markdown
            default: |
              Porodični smo domaćini. Trudimo se da se osjećate kao kod kuće — od čaše vina
              za dobrodošlicu do savjeta gdje se najbolje jede u Baru.
      - name: obavjestenje
        label: "Obavještenje (traka na vrhu sajta)"
        file: "src/content/announcement/me.md"
        fields:
          - { name: enabled, label: "Prikaži obavještenje na sajtu", widget: boolean, default: false }
          - name: body
            label: "Tekst obavještenja"
            widget: string
            default: "Dobrodošli! Pišite nam za slobodne termine ovog ljeta."
            hint: "Npr. posebna ponuda ili važna napomena za goste. Uključi/isključi prekidačem iznad."

  - name: fotografije
    label: "Fotografije"
    files:
      - name: galerija
        label: "Galerija fotografija"
        file: "src/content/gallery/me.yml"
        fields:
          - name: photos
            label: "Fotografije"
            label_singular: "fotografija"
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: "Fotografija", widget: image }
              - { name: caption, label: "Kratak opis", widget: string, required: false, hint: "Prikazuje se uz sliku i pomaže Google pretrazi." }

  - name: recenzije
    label: "Recenzije gostiju"
    files:
      - name: citati
        label: "Citati gostiju"
        file: "src/content/quotes/me.yml"
        fields:
          - name: quotes
            label: "Recenzije"
            label_singular: "recenzija"
            widget: list
            summary: "{{fields.guest}}: {{fields.quote}}"
            fields:
              - { name: quote, label: "Citat iz recenzije", widget: text }
              - { name: guest, label: "Ime gosta", widget: string }
              - { name: country, label: "Zemlja gosta", widget: string, required: false }

  - name: postavke
    label: "Postavke i kontakt"
    files:
      - name: kontakt
        label: "Kontakt podaci"
        file: "src/content/settings/index.yml"
        fields:
          - { name: phone, label: "Broj telefona", widget: string, default: "+382 6X XXX XXX" }
          - { name: whatsapp, label: "WhatsApp broj", widget: string, default: "+382 6X XXX XXX" }
          - { name: viber, label: "Viber broj", widget: string, default: "+382 6X XXX XXX" }
          - { name: email, label: "Email adresa", widget: string, default: "kontakt@maremonti.me" }
          - { name: instagram, label: "Instagram (link)", widget: string, required: false, default: "https://www.instagram.com/mare_e_monti_antivari/" }
          - { name: booking, label: "Booking.com (link)", widget: string, required: false, default: "https://www.booking.com/hotel/me/mare-e-monti-bar.html" }
          - { name: score, label: "Ocjena na Booking.com", widget: string, default: "10.0" }
          - { name: checkin, label: "Prijava (check-in)", widget: string, default: "od 15:00" }
          - { name: checkout, label: "Odjava (check-out)", widget: string, default: "do 11:00" }
          - { name: hero, label: "Naslovna fotografija", widget: image, required: false }
